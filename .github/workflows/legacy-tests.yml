# Censo de los tests del legado de QwenPaw contra DEV (MIG-4a, BL-043, DEC-029).
# Copia los tests de gw2-wallet-agents (público, MIT, fijado a un commit) a una copia
# de DEV, los corre ahí y en el legado, y guarda el informe en tools/legacy/CENSO.md.
# Así los ~90 archivos no pasan a mano por la Factory: se decide con evidencia.
#
# Seguridad:
# - Solo corre en gw2-factory-dev.
# - El legado se lee, nunca se escribe (checkout sin credenciales persistidas).
# - Escribe tools/legacy/CENSO.md y, si existe tools/legacy/importar.txt, copia a tests/
#   los archivos de esa lista (MIG-4b), solo si todos pasan contra DEV. No toca la app ni la memoria.
# - Un push hecho con GITHUB_TOKEN no dispara otros workflows: no hay bucles.

name: legacy-tests

on:
  push:
    branches: [main]
    paths:
      - 'tools/legacy/**'
      - '!tools/legacy/CENSO.md'
      - '!tools/legacy/IMPORTACION.txt'
      - '.github/workflows/legacy-tests.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: legacy-tests
  cancel-in-progress: false

env:
  LEGACY_REF: eb91075f3e6a2d107ebdd8b994b4a1440fe29516

jobs:
  census:
    if: github.repository == 'PabloSnchz/gw2-factory-dev'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: PabloSnchz/gw2-wallet-agents
          ref: ${{ env.LEGACY_REF }}
          path: _legacy
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Censo
        run: node tools/legacy/census.cjs --legacy _legacy --dev . --out tools/legacy/CENSO.md --ref "$LEGACY_REF" --timeout 90 --jobs 4

      # Si algo no pasa, census.cjs no deja nada copiado; el motivo queda en
      # tools/legacy/IMPORTACION.txt, porque la Factory no puede leer los logs de CI (RSK-016).
      - name: Importar la lista (solo lo que pasa en DEV)
        run: |
          if [ -f tools/legacy/importar.txt ]; then
            node tools/legacy/census.cjs --import tools/legacy/importar.txt --legacy _legacy --dev . --timeout 90 > tools/legacy/IMPORTACION.txt 2>&1 \
              || echo "RESULTADO: no se importó nada" >> tools/legacy/IMPORTACION.txt
            cat tools/legacy/IMPORTACION.txt
          fi

      - name: Guardar el informe y lo importado
        run: |
          git config user.name "shiruvana-factory[bot]"
          git config user.email "shiruvana-factory@users.noreply.github.com"
          git add tools/legacy/CENSO.md tests
          if [ -f tools/legacy/IMPORTACION.txt ]; then git add tools/legacy/IMPORTACION.txt; fi
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "MIG-4: censo e importación de tests del legado (CI)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
