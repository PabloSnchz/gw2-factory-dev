# Canal de respuesta del Centro de Decisiones (DEC-012).
# Pablo responde desde el panel → issue prellenado → este workflow escribe
# ai-memory/responses/RESP-XXX.md (DEC-011), comenta y cierra el issue.
#
# Seguridad:
# - Solo corre en gw2-factory-dev (si el archivo llega a producción por copia, no hace nada).
# - Solo issues del dueño del repositorio con la marca del Centro de Decisiones.
# - El texto del issue nunca se interpola en comandos: lo lee el script desde el evento.
# - Permisos mínimos: escribir contenido (la respuesta) e issues (comentar y cerrar).

name: decision-response

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: decision-response
  cancel-in-progress: false

jobs:
  respond:
    if: >-
      github.repository == 'PabloSnchz/gw2-factory-dev' &&
      github.event.issue.user.login == github.repository_owner &&
      contains(github.event.issue.body, 'gds:decision-response')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v7
        with:
          script: |
            const run = require('./.github/scripts/decision-response.cjs');
            await run({ github, context, core });
