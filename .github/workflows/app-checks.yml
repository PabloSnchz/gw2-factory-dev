# Chequeos de la aplicación en cada push y PR. No despliega ni envía nada.
# tests/*.test.cjs son los de DEV; tests/*.test.js y *.smoke.js son los del legado
# importados por CI (MIG-4, DEC-029): scripts que fallan con código distinto de 0.
name: app-checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests de la app
        run: |
          shopt -s nullglob
          node --test tests/*.test.cjs tests/*.test.js tests/*.smoke.js
