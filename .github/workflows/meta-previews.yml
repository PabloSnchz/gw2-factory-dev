# Vistas previas de Metas y Eventos servidas desde La Bóveda (BL-057, MET-1b).
# Baja de la Guild Wars 2 Wiki las imágenes de las infusiones (la Factory no tiene red; CI sí),
# convierte las 10 vistas previas a WebP en assets/previews/ y deja el resultado en
# tools/meta-previews/REPORTE.md, porque la Factory no puede leer los logs de CI (RSK-016).
#
# Seguridad:
# - Solo corre en gw2-factory-dev.
# - Escribe assets/previews/ y tools/meta-previews/REPORTE.md; no toca la app, los originales
#   de assets/gifanim ni la memoria. Lo que falla no deja archivo y queda dicho en el informe.
# - Un push hecho con GITHUB_TOKEN no dispara otros workflows: no hay bucles.

name: meta-previews

on:
  push:
    branches: [main]
    paths:
      - 'tools/meta-previews/**'
      - '!tools/meta-previews/REPORTE.md'
      - '.github/workflows/meta-previews.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: meta-previews
  cancel-in-progress: false

jobs:
  previews:
    if: github.repository == 'PabloSnchz/gw2-factory-dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pillow
        run: python -m pip install --disable-pip-version-check 'pillow>=11,<13'

      - name: Convertir
        run: python tools/meta-previews/build_previews.py --out assets/previews --report tools/meta-previews/REPORTE.md

      - name: Guardar imágenes e informe
        run: |
          git config user.name "shiruvana-factory[bot]"
          git config user.email "shiruvana-factory@users.noreply.github.com"
          git add assets/previews tools/meta-previews/REPORTE.md
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "MET-1b: vistas previas de Metas y Eventos en assets/previews (CI)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
